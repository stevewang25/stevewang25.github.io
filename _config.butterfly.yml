# --------------------------------------
# Butterfly Theme Configuration - Glassmorphism Dark Knight
# Docs: https://butterfly.js.org/
# --------------------------------------

# Navigation
nav:
  logo: /images/logo.png
  display_title: true
  fixed: false

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  关于: /about/ || fas fa-user

# Code Blocks - dark theme fits Batman aesthetic
code_blocks:
  theme: darker
  macStyle: true
  height_limit: false
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: false

# Social links
social:
  fab fa-github: https://github.com/stevewang25 || Github || '#49B1F5'

# Image Settings
favicon: /images/favicon.ico
avatar:
  img: /images/avatar.jpg
  effect: true

# Banner images - Batman 2025 comic 4K backgrounds
disable_top_img: false

# Default top image for pages without specific banner
default_top_img: /images/batman-bg-1.jpg

# Homepage banner
index_img: /images/batman-bg-1.jpg

# Archive banner
archive_img: /images/batman-bg-2.jpg

# Tag banner
tag_img: /images/batman-bg-3.jpg

# Category banner
category_img: /images/batman-bg-2.jpg

# Site background (optional)
background:

# Cover settings
cover:
  index_enable: true
  aside_enable: true
  archives_enable: true

# Home page subtitle - typewriter effect
subtitle:
  enable: true
  effect: true
  source: false
  sub:
    - 黑暗中的骑士，代码里的行者
    - I am Vengeance. I am the Night.
    - 记录技术，分享生活

# Index layout
index_layout: 3
index_post_content:
  method: 3
  length: 500

# Post Settings
toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: true
    label: true
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

reward:
  enable: false

related_post:
  enable: true
  limit: 6
  date_type: created

post_pagination: 1

# Footer
footer:
  owner:
    enable: true
    since: 2025
  copyright:
    enable: true
    version: true
  custom_text:  Powered by Hexo & Butterfly | Dark Knight Rises

# Sidebar (glassmorphism compatible)
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 暗夜骑士 / 代码行者
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/stevewang25
  card_announcement:
    enable: true
    content: 💎 黑暗中的代码之光
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 40
    color: false
    orderby: random
    order: 1
  card_archives:
    enable: true
    type: monthly
    format: YYYY年MM月
    order: -1
    limit: 8
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

# Bottom right buttons
readmode: true

# Dark mode - default to dark for Batman theme vibe
darkmode:
  enable: true
  button: true
  autoChangeMode: 1

rightside_scroll_percent: false

# Search
search:
  use: local_search
  placeholder: 搜索文章...
  local_search:
    preload: false
    top_n_per_article: 1
    unescape: false

# Comments - Giscus
comments:
  use: giscus
  text: true
  lazyload: true
  count: false
  card_post_count: false

giscus:
  repo: stevewang25/stevewang25.github.io
  repo_id:
  category_id:
  light_theme: light
  dark_theme: dark_dimmed

# Share
share:
  use: sharejs
  sharejs:
    sites: facebook,x,wechat,weibo,qq

# Analysis
baidu_analytics:

# Theme Color - Dark Knight palette
theme_color:
  enable: true
  main: "#49B1F5"
  paginator: "#49B1F5"
  button_hover: "#FF7242"
  text_selection: "#49B1F5"
  link_color: "#49B1F5"
  meta_color: "#a0a0b0"
  hr_color: "#49B1F5"
  code_foreground: "#F47466"
  code_background: "rgba(15, 15, 25, .7)"
  toc_color: "#49B1F5"
  blockquote_padding_color: "#49B1F5"
  blockquote_background_color: "rgba(73, 177, 245, 0.1)"
  scrollbar_color: "#49B1F5"
  meta_theme_color_light: "1a1a2e"
  meta_theme_color_dark: "#0d0d0d"

rounded_corners_ui: true

mask:
  header: true
  footer: true

# Loading animation
preloader:
  enable: true
  source: 1

enter_transitions: true

display_mode: dark

# Font
font:
  global_font_size: 16px
  code_font_size: 14px

hr_icon:
  enable: true

# Disable default ribbon - using custom firefly effect instead
canvas_ribbon:
  enable: false

# Firefly effect (custom)
fireworks:
  enable: false

click_heart:
  enable: false

# Lightbox
lightbox: fancybox

# ==========================================
# Custom CSS & JS Injection
# ==========================================
inject:
  head:
    - <link rel="stylesheet" href="/css/glassmorphism.css">
  bottom:
    - <script src="/js/firefly.js"></script>

# CDN
CDN:
  internal_provider: local
  third_party_provider: jsdelivr
  version: true

# PWA
pwa:
  enable: false

# Open graph
Open_Graph_meta:
  enable: true
