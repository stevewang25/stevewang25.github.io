# --------------------------------------
# Butterfly Theme - 凡人修仙传 仙侠风格
# --------------------------------------

# Navigation
nav:
  logo:
  display_title: true
  fixed: false

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  关于: /about/ || fas fa-user

# Code Blocks - 墨色风格
code_blocks:
  theme: darker
  macStyle: true
  height_limit: false
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: false

# Social links
social:
  fab fa-github: https://github.com/stevewang25 || Github || '#c9a96e'

# Banner images - 凡人修仙传 4K
disable_top_img: false

default_top_img: /images/fanren-bg-1.jpg
index_img: /images/fanren-bg-1.jpg
archive_img: /images/fanren-bg-2.jpg
tag_img: /images/fanren-bg-3.jpg
category_img: /images/fanren-bg-2.jpg

# Home page subtitle - 修仙风
subtitle:
  enable: true
  effect: true
  source: false
  sub:
    - 凡人不凡，修仙之路
    - 大道三千，只取一瓢
    - 记录技术与生活

# Index layout
index_layout: 3
index_post_content:
  method: 3
  length: 500

# Post Settings
toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: true
    label: true
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

reward:
  enable: false

related_post:
  enable: true
  limit: 6
  date_type: created

post_pagination: 1

# Footer
footer:
  owner:
    enable: true
    since: 2025
  copyright:
    enable: true
    version: true
  custom_text:  Powered by Hexo & Butterfly | 凡人不凡

# Sidebar
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 修仙路上的代码行者
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/stevewang25
  card_announcement:
    enable: true
    content: ✨ 大道至简，凡人不凡
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 40
    color: false
    orderby: random
    order: 1
  card_archives:
    enable: true
    type: monthly
    format: YYYY年MM月
    order: -1
    limit: 8
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

# Bottom right buttons
readmode: true

# Dark mode
darkmode:
  enable: true
  button: true
  autoChangeMode: 1

rightside_scroll_percent: false

# Search
search:
  use: local_search
  placeholder: 搜索文章...
  local_search:
    preload: false
    top_n_per_article: 1
    unescape: false

# Comments
comments:
  use: giscus
  text: true
  lazyload: true
  count: false
  card_post_count: false

giscus:
  repo: stevewang25/stevewang25.github.io
  repo_id:
  category_id:
  light_theme: light
  dark_theme: dark_dimmed

# Share
share:
  use: sharejs
  sharejs:
    sites: wechat,weibo,qq

# Theme Color - 仙侠金+墨绿配色
theme_color:
  enable: true
  main: "#c9a96e"
  paginator: "#c9a96e"
  button_hover: "#d4a574"
  text_selection: "#c9a96e"
  link_color: "#c9a96e"
  meta_color: "#a09080"
  hr_color: "#8b7355"
  code_foreground: "#d4a574"
  code_background: "rgba(15, 12, 8, .85)"
  toc_color: "#c9a96e"
  blockquote_padding_color: "#c9a96e"
  blockquote_background_color: "rgba(201, 169, 110, 0.08)"
  scrollbar_color: "#8b7355"
  meta_theme_color_light: "1a1610"
  meta_theme_color_dark: "#0d0b06"

rounded_corners_ui: true

mask:
  header: true
  footer: true

preloader:
  enable: true
  source: 1

enter_transitions: true

display_mode: dark

font:
  global_font_size: 16px
  code_font_size: 14px

hr_icon:
  enable: true

# 关闭默认彩带 - 使用自定义仙气粒子特效
canvas_ribbon:
  enable: false

fireworks:
  enable: false

click_heart:
  enable: false

lightbox: fancybox

# Custom CSS & JS - 仙侠毛玻璃 + 灵气粒子
inject:
  head:
    - <link rel="stylesheet" href="/css/xianxia.css">
  bottom:
    - <script src="/js/xianxia-particles.js"></script>

CDN:
  internal_provider: local
  third_party_provider: jsdelivr
  version: true

pwa:
  enable: false

Open_Graph_meta:
  enable: true
