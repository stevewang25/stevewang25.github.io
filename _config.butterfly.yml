# --------------------------------------
# Butterfly Theme Configuration
# Docs: https://butterfly.js.org/
# --------------------------------------

# Navigation
nav:
  logo:
  display_title: true
  fixed: false

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  关于: /about/ || fas fa-user

# Code Blocks
code_blocks:
  theme: darker
  macStyle: true
  height_limit: false
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: false

# Social links
social:
  fab fa-github: https://github.com/stevewang25 || Github || '#24292e'

# Image Settings
favicon:
avatar:
  img: https://avatars.githubusercontent.com/u/0?v=4
  effect: false

disable_top_img: false
default_top_img:

# Home page subtitle
subtitle:
  enable: true
  effect: true
  source: false
  sub:
    - 欢迎来到我的博客
    - 记录学习与成长

# Index layout
index_layout: 3
index_post_content:
  method: 3
  length: 500

# Post Settings
toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: true
    label: true
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

reward:
  enable: false

related_post:
  enable: true
  limit: 6
  date_type: created

post_pagination: 1

# Footer
footer:
  owner:
    enable: true
    since: 2025
  copyright:
    enable: true
    version: true
  custom_text:  Powered by Hexo & Butterfly

# Sidebar
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 全栈开发 / 终身学习者
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/stevewang25
  card_announcement:
    enable: true
    content: 欢迎来到我的个人博客！🎉
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 40
    color: false
    orderby: random
    order: 1
  card_archives:
    enable: true
    type: monthly
    format: YYYY年MM月
    order: -1
    limit: 8
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

# Bottom right buttons
readmode: true

# Dark mode
darkmode:
  enable: true
  button: true
  autoChangeMode: 1

rightside_scroll_percent: false

# Search (local search)
search:
  use: local_search
  placeholder: 搜索文章...
  local_search:
    preload: false
    top_n_per_article: 1
    unescape: false

# Comments - Giscus (free, open source, GitHub-based)
comments:
  use: giscus
  text: true
  lazyload: true
  count: false
  card_post_count: false

giscus:
  repo: stevewang25/stevewang25.github.io
  repo_id:
  category_id:
  light_theme: light
  dark_theme: dark

# Share
share:
  use: sharejs
  sharejs:
    sites: facebook,x,wechat,weibo,qq

# Analysis (BAIDU)
baidu_analytics:

# Beautify
theme_color:
  enable: true
  main: "#49B1F5"
  paginator: "#00c4b6"
  button_hover: "#FF7242"
  text_selection: "#00c4b6"
  link_color: "#99a9bf"
  meta_color: "#858585"
  hr_color: "#A4D8FA"
  code_foreground: "#F47466"
  code_background: "rgba(27, 31, 35, .05)"
  toc_color: "#00c4b6"
  blockquote_padding_color: "#49b1f5"
  blockquote_background_color: "#49b1f5"
  scrollbar_color: "#49b1f5"
  meta_theme_color_light: "ffffff"
  meta_theme_color_dark: "#0d0d0d"

rounded_corners_ui: true

mask:
  header: true
  footer: true

# Loading animation
preloader:
  enable: true
  source: 1

enter_transitions: true

display_mode: light

# Font
font:
  global_font_size: 16px
  code_font_size: 14px

hr_icon:
  enable: true

# Background effects
canvas_ribbon:
  enable: true
  size: 150
  alpha: 0.6
  zIndex: -1
  click_to_change: false
  mobile: false

# Lightbox
lightbox: fancybox

# Inject
inject:
  head:
  bottom:

# CDN
CDN:
  internal_provider: local
  third_party_provider: jsdelivr
  version: true

# PWA
pwa:
  enable: false

# Open graph
Open_Graph_meta:
  enable: true
